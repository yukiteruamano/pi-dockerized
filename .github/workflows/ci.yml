name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA (the tag is in the trailing comment); Renovate
# keeps them current. Never reference a mutable tag here.
jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Syntax check
        run: |
          bash -n bin/pi-dockerized install.sh entrypoint.sh
          for f in lib/*.sh lib/*/*.sh completions/*.sh scripts/*.sh container/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
        env:
          SHELLCHECK_OPTS: -x -S warning

      # Advisory until the tree is normalized with `shfmt -w -i 4 -ci .`:
      # then drop `continue-on-error` to enforce it.
      - name: shfmt (advisory)
        continue-on-error: true
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
          "$(go env GOPATH)/bin/shfmt" -d -i 4 -ci bin/ lib/ install.sh entrypoint.sh scripts/ container/ completions/ tests/

      - name: actionlint (advisory)
        continue-on-error: true
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/

      - name: Wrapper args test
        run: bash tests/wrapper-args.test.sh

      - name: Wrapper commands test
        run: bash tests/wrapper-commands.test.sh

      - name: Config sync round-trip (ephemeral HOME, no Docker)
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          export PATH="$PWD/bin:$PATH"
          mkdir -p "$HOME"
          bash bin/pi-dockerized config sync
          bash bin/pi-dockerized config sync --check

  dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  policy:
    name: Security guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Guard syntax
        run: |
          for f in extensions/pi-security-guard/*.mjs container/*.mjs; do node --check "$f"; done

      - name: Policy regression tests
        run: node tests/security-guard.test.mjs

      - name: Extension wiring and self-test
        run: node tests/guard-extension.test.mjs

      - name: Pi Packages settings guard
        run: node tests/ext-agent.test.mjs

  guard-version:
    name: Guard version bump
    # Pull requests compare against their base; pushes to master against the
    # commit before the push, so a direct push cannot skip the check.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Changing the guard or the pattern sets changes behavior, which must be
      # visible in `pi-dockerized version`: GUARD_VERSION has to go up with it.
      - name: GUARD_VERSION increased with the guard
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          changed="$(git diff --name-only "$base" HEAD -- extensions/pi-security-guard policies \
            | grep -v -E '(^|/)(README\.md|LICENSE[^/]*|\.upstream-[a-z]+)$' || true)"
          if [ -z "$changed" ]; then
            echo "Guard and policies untouched."
            exit 0
          fi
          echo "Guard/policy files changed:"
          echo "$changed"
          guard_version() {
            git show "$1:extensions/pi-security-guard/policy.mjs" 2>/dev/null \
              | sed -n 's/^export const GUARD_VERSION = \([0-9][0-9]*\);.*/\1/p' | head -n 1
          }
          old="$(guard_version "$base")"
          new="$(guard_version HEAD)"
          if [ -z "$new" ]; then
            echo "::error::Cannot read GUARD_VERSION from extensions/pi-security-guard/policy.mjs."
            exit 1
          fi
          if [ -n "$old" ] && [ "$new" -le "$old" ]; then
            echo "::error::The guard or policies changed but GUARD_VERSION went from $old to $new; it must increase."
            exit 1
          fi
          echo "GUARD_VERSION ${old:-none} -> $new."
