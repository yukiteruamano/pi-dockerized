name: Security scans

# Secret scanning on every push/PR, and a vulnerability scan of the image on
# changes that affect it plus a weekly schedule (base-image and package CVEs
# appear without any commit).

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: pi-dockerized:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail on fixable HIGH/CRITICAL findings only: unfixed ones are reported by
      # Trivy but cannot be acted on by this repository.
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pi-dockerized:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
